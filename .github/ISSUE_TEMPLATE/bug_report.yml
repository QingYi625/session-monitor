name: 问题反馈
description: 面板报错、数据不正确或无法打开时使用
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先确认插件已放到 `~/.gemini/config/plugins/session-monitor` 并重启过 Antigravity。
        请勿粘贴包含 API Key、账号或其他敏感信息的日志。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际看到的现象，以及你期望的结果
      placeholder: 例如：打开面板后一直显示 0 轮 0 步，但对话里已经有内容
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开对话
        2. 点击右上角 + 菜单 → 会话统计
        3. 观察 ...
    validations:
      required: true

  - type: input
    id: antigravity-version
    attributes:
      label: Antigravity 版本
      placeholder: 例如 1.x.x
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 可直接拖拽图片到此处；截图中如包含对话标题等私人内容，请先打码
      placeholder: 无
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 已确认插件目录结构完整（`plugin.json` 在根目录）
          required: true
        - label: 已尝试重启 Antigravity 后复现
          required: true
