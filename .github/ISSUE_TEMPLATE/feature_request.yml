name: 功能建议
description: 希望面板展示新的指标或增加新的交互
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你正在做什么，遇到什么不方便的地方
      placeholder: 例如：想对比两次请求的缓存命中变化，但现在只能看到当前值
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 希望面板如何展示或交互
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，或现有工具里类似的设计
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考链接或其他说明
    validations:
      required: false
